[project]
name = "miraicl"
version = "0.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiorwlock>=1.5.0",
    "hishel[httpx]>=1.1.6",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "psutil>=7.1.3",
    "pytauri-wheel==0.8.*",
    "pythonnet>=3.0.5",
]

[dependency-groups]
dev = ["MiraiCL"]

[tool.uv.workspace]
members = ["src-tauri"]

[tool.uv.sources]
MiraiCL = { workspace = true }


[project.entry-points.pytauri]
ext_mod = "tauri_app.ext_mod"

#[build-system]
#requires = ["setuptools >= 80"]
#build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { where = ["python"] }  
